<script src="system/main.js?v=mini-rebuild-20260817"></script>
<script>
(function(){
  var lost=[];
  function need(n,ok){ if(!ok) lost.push(n); }
  need('PX', typeof PX!=='undefined'); need('PAL', typeof PAL!=='undefined');
  need('TILES', typeof TILES!=='undefined'); need('PROPS', typeof PROPS!=='undefined');
  need('SPRITES', typeof SPRITES!=='undefined'); need('PORTRAITS', typeof PORTRAITS!=='undefined');
  need('MAPS', typeof MAPS!=='undefined'); need('UI', typeof UI!=='undefined');
  need('SYSTEM', typeof SYSTEM!=='undefined'); need('AUDIO', typeof AUDIO!=='undefined');
  need('CONTENT', typeof CONTENT!=='undefined'); need('DECISIONS', typeof DECISIONS!=='undefined'); need('STORY', typeof ODYSSEY_STORY!=='undefined');
  function show(){
    var b=document.getElementById('boot');
    if(lost.length){ if(b) b.textContent='모듈 로드 실패: '+lost.join(', '); return; }
    if(b) b.remove();
    var w=document.getElementById('wrap'); if(w) w.hidden=false; }
  if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',show); else show();
  window.addEventListener('error', function(e){
    var b=document.getElementById('boot'); if(b) b.textContent='오류: '+e.message; });
})();
</script>
